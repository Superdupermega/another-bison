id: secret_ingress
description: Never let credentials or tokens into model context, including via retrieved documents.
stage: ingress
action: block
severity: critical
detector:
  type: regex
  patterns:
    - 'AKIA[0-9A-Z]{16}'
    - 'sk-[A-Za-z0-9]{20,}'
    - '-----BEGIN (?:RSA |EC )?PRIVATE KEY-----'
    - '(?i)(?:api[_-]?key|secret|token|password)\s*[:=]\s*["'']?[A-Za-z0-9_\-]{12,}'
telemetry: {metric: fence.secret_ingress.blocks, hard_floor: "0 secrets reaching model / 30d"}
test:
  should_match:
    - "config: api_key = sk-abcdefghijklmnopqrstuvwxyz"
    - "-----BEGIN PRIVATE KEY-----"
  should_not_match:
    - "The token budget for this request is 4000"
    - "Reset your password using the link in the email"
